# Run `pre-commit autoupdate` to bump pinned hook versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"]  # syntax only; allows Compose tags like !override
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^app/web/static/vendor/  # byte-identical to the verified npm files
      - id: trailing-whitespace
        exclude: ^app/web/static/vendor/  # byte-identical to the verified npm files
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        exclude: ^app/web/static/vendor/  # byte-identical to the verified npm files
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Blocks commits whose author or committer email is not a GitHub noreply address.
  - repo: local
    hooks:
      - id: noreply-identity
        name: commit identity must be a GitHub noreply address
        entry: bash -c 'e="$(git config user.email)"; case "$e" in *@users.noreply.github.com) exit 0;; *) echo "user.email is \"$e\" - set it to your GitHub noreply address"; exit 1;; esac'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: mypy
        name: mypy (uv run mypy app tests)
        entry: uv run mypy app tests
        language: system
        types: [python]
        pass_filenames: false
