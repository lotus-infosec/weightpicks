name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs the full CI on the tagged commit

permissions:
  contents: read

# One group per trigger: a release's own CI run (workflow_call, where github.workflow is
# the caller's name) can't cancel a push run on the same ref. Only superseded PR runs are
# cancelled; every commit on main keeps its result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy app tests

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q -m "not perf and not calibration and not e2e and not load" --cov --cov-report=term-missing:skip-covered
      - name: Coverage gate (app/domain and app/services >= 95%)
        run: uv run coverage report --include='app/domain/*,app/services/*' --fail-under=95
      - name: Performance budgets and calibration (no coverage instrumentation)
        env:
          PERF_BUDGET_SCALE: "2"  # shared runners are ~2x slower than the dev machine
        run: uv run pytest -q -m "perf or calibration or load" -s

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Build the stylesheet (layout test checks it is applied)
        run: ./scripts/build-css.sh
      - name: Install Chromium and its system libraries (version pinned by uv.lock)
        run: uv run playwright install --with-deps chromium
      - name: Browser tests at 375 px (register, bet, feed)
        run: uv run pytest -q -m e2e --tracing=retain-on-failure --output=test-results

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full git history
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: weightpicks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            -e APP_ENV=dev -e DATA_DIR=/tmp weightpicks:ci cli migrate
          test "$(docker run --rm --entrypoint id weightpicks:ci -u)" = "10001"
      - name: Trivy (fixable CRITICAL/HIGH fail the build)
        run: |
          docker save weightpicks:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan" \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --input /scan/image.tar --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 --no-progress

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (workflows, including their shell scripts)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color
      - name: shellcheck (scripts)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x scripts/install.sh scripts/upgrade.sh scripts/lib.sh scripts/build-css.sh
          scripts/browser.sh scripts/init-dev-env.sh docker/entrypoint.sh
          .github/scripts/upgrade-test.sh

  install-smoke:
    # A fresh runner stands in for a fresh host: install, re-run, upgrade, factory reset.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        run: ./scripts/install.sh --build --yes --no-tunnel --hostname picks.example.com | tee "$RUNNER_TEMP/install.log"
      - name: Healthy, setup token printed, /setup answers
        run: |
          grep -q 'SETUP TOKEN: ' "$RUNNER_TEMP/install.log"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/setup)" = 200
          test "$(stat -c %a .env)" = 600
          grep -q '^WP_BASE_URL=https://picks.example.com$' .env
      - name: Re-running keeps the secret key
        run: |
          before="$(grep '^APP_SECRET_KEY=' .env | sha256sum)"
          ./scripts/install.sh --build --yes --no-tunnel
          test "$before" = "$(grep '^APP_SECRET_KEY=' .env | sha256sum)"
          test "$(grep -c '^APP_SECRET_KEY=' .env)" = 1
      - name: upgrade.sh (rebuild) backs up and comes back healthy
        run: ./scripts/upgrade.sh --build | tee "$RUNNER_TEMP/upgrade.log" && grep -q 'Upgraded ' "$RUNNER_TEMP/upgrade.log"
      - name: Factory reset on the image issues a new setup token
        run: |
          before="$(docker compose logs web | grep -o 'SETUP TOKEN: [A-Za-z0-9_-]*' | tail -n 1)"
          docker compose exec -T worker wp maintenance reset --confirm WeightPicks
          docker compose restart
          . scripts/lib.sh && wait_healthy
          after="$(docker compose logs web | grep -o 'SETUP TOKEN: [A-Za-z0-9_-]*' | tail -n 1)"
          test -n "$after" && test "$before" != "$after"
      - if: always()
        run: docker compose logs --tail 60 web worker; docker compose down

  install-prereqs:
    # The Docker and cloudflared apt steps on both supported Ubuntu releases (no daemon).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" ubuntu:${{ matrix.ubuntu }}
          bash -c 'apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          && /src/scripts/install.sh --prereqs-only --yes
          && docker --version && docker compose version && cloudflared --version'
