name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste secrets, tokens, webhook URLs, your `.env` or real health data. Security problems go to **Report a vulnerability** instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`WP_VERSION` from your `.env`, or the commit if you built from source"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Ubuntu 24.04, Ubuntu 22.04, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker compose logs --tail 100 web worker` (check them for anything private first)"
      render: text
