<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false}'>
  <title>{% block title %}WeightPicks{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {# app.js registers Alpine components on alpine:init, so it must load before Alpine. #}
  <script src="/static/app.js" defer></script>
  <script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
  <script src="/static/vendor/alpine-csp-3.17.4.min.js" defer></script>
</head>
<body class="app" hx-headers='{{ {"X-CSRF-Token": csrf} | tojson }}'>
  {% if session %}
  <header class="topbar">
    <a class="brand" href="/">WeightPicks</a>
    {% if wallet %}<span class="wallet" data-testid="balance">{{ wallet.balance_cents | money }}</span>{% endif %}
    <form method="post" action="/api/auth/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <button type="submit" class="link">Log out</button>
    </form>
  </header>
  {% if session.role == "player" %}
  <nav class="nav">
    <a href="/" class="{{ 'active' if active == 'board' }}">Board</a>
    <a href="/bets/mine" class="{{ 'active' if active == 'mine' }}">My bets</a>
    <a href="/bets/feed" class="{{ 'active' if active == 'feed' }}">Feed</a>
  </nav>
  {% endif %}
  {% endif %}
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
