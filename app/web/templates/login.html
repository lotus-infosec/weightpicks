{% extends "base.html" %}
{% block title %}Log in · WeightPicks{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/api/auth/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ form_csrf }}">
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Log in</button>
  </form>
  <p class="muted">Got a registration code? <a href="/register">Create an account</a></p>
</section>
{% endblock %}
