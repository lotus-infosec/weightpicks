[project]
name = "weightpicks"
version = "1.1.0"
description = "Self-hosted fake-money pick'em on one person's weigh-ins"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wp = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["weightpicks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DTZ", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts, dummy secrets, seeded PRNG
"migrations/**" = ["S"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e and not load'"
markers = [
    "perf: wall-clock performance budgets (CI runs them without coverage)",
    "calibration: full line-engine calibration runs (CI runs them without coverage)",
    "season: simulated-season suite (tests/season); runs in the main test job on every PR",
    "e2e: Playwright browser tests (tests/e2e); excluded by default, run with -m e2e",
    "load: 50 users betting over HTTP while settlement runs; excluded by default, run with -m load",
]

[tool.coverage.run]
source = ["app"]
branch = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright==0.9.0",
    "ruff>=0.16.10",
]
